# Multiple-network linear-model experiment using the adjacency-level global
# MRQAP permutation test.

experiment_type: linear_model

simulation:
  nsim: 200
  seed: 2

  n: [50, 100, 200]
  p: [5, 10, 25, 50, 100]
  d_x: [5]
  d_y: [5]

  # snr=0 uses B=0 (the null); positive SNRs sample and rescale B.
  snr: [0, 0.1, 0.25, 0.5, 1]
  alpha: [0.05]
  edge_var: [2]

  parallel: true
  n_jobs: -1
  batch_size: 32
  blas_threads: 1

methods:
  npermutations: [400]
  list:
    - name: MRQAP
      kwargs:
        permutation_strategy: y_permutation
        batch_size: 32

setups:
  - dgp: GaussianNetwork
    solver: ASE

  - dgp: BernoulliNetwork
    solver: pgd_fit_wrapper
    dgp_kwargs:
      rdpg: false
    solver_kwargs:
      backend: numpy

metrics:
  compute_all: true

output:
  results_dir: results
  file_prefix: linear_model_mrqap_results
