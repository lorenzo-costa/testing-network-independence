# Three-dimensional Z, Y, and X with independent Gaussian X coordinates.
# Each Z_j and Y_j loads only on X_j. Z_j is uniform on [0, 1/sqrt(3)],
# keeping every RDPG inner product in [0, 1].
# The four setups cover every marginal/conditional Z-Y dependence combination.
# Correlations are in Gaussian copula coordinates; -1/3 cancels marginal
# dependence when both loadings are 0.5.
# Model-X draws use a Gaussian KDE fitted on half the nodes; bandwidth is
# selected by five-fold cross-validation from the candidates below.

simulation:
  nsim: 100
  seed: 1
  n: [100, 200, 500, 1000]
  k: [3]
  ky: [3]
  rho: [0]  # Legacy sweep field; dependence is specified in each setup.
  alpha: [0.05]
  edge_var: [3]  # Required by the loader; ignored by BernoulliNetwork.
  marginals:
    - {x: gaussian, z: "uniform 0 0.5773502691896258", y: gaussian}

methods:
  npermutations: [500]
  use_true_latent: [false]
  list:
    - name: MultivariateACTest
      kwargs:
        M: 0.5
        standardize: false
        use_permutation_coeff: true
        test_type: model_X
        estimate_conditional: true
        test_size: 0.5
        conditional_estimator: &kde_estimator
          name: GaussianKDEConditionalEstimator
          kwargs:
            bandwidth: [0.05, 0.1, 0.2]
            n_splits: 5
    
    - name: MultivariateACTest
      kwargs:
        M: 1
        standardize: false
        use_permutation_coeff: true
        test_type: model_X
        estimate_conditional: true
        test_size: 0.5
        conditional_estimator: *kde_estimator
    
    - name: MultivariateACTest
      kwargs:
        adaptive_m: true
        standardize: false
        use_permutation_coeff: true
        test_type: model_X
        estimate_conditional: true
        test_size: 0.5
        conditional_estimator: *kde_estimator
    
    - name: DistanceCorrelationTest
      kwargs:
        test_method: mgc
        test_type: model_X
        estimate_conditional: true
        test_size: 0.5
        conditional_estimator: *kde_estimator
        
    - name: CanonicalCorrelationTest
      kwargs:
        test_type: model_X
        estimate_conditional: true
        test_size: 0.5
        conditional_estimator: *kde_estimator

setup_template: &rdpg_setup
  dgp: BernoulliNetwork
  solver: ASE
  rdpg: true
  continuous_conditional_copula: gaussian
  px: 3

setups:
  # Marginally independent; dependent given X.
  - <<: *rdpg_setup
    correlation_zx: &loading_half
      - [0.5, 0, 0]
      - [0, 0.5, 0]
      - [0, 0, 0.5]
    correlation_yx: *loading_half
    conditional_correlation_zy:
      - [-0.3333333333333333, 0, 0]
      - [0, -0.3333333333333333, 0]
      - [0, 0, -0.3333333333333333]

  # Marginally dependent; independent given X.
  - <<: *rdpg_setup
    correlation_zx: *loading_half
    correlation_yx: *loading_half
    conditional_correlation_zy: &zero_cross
      - [0, 0, 0]
      - [0, 0, 0]
      - [0, 0, 0]

  # Marginally dependent; dependent given X.
  - <<: *rdpg_setup
    correlation_zx: *loading_half
    correlation_yx: *loading_half
    conditional_correlation_zy:
      - [0.5, 0, 0]
      - [0, 0.5, 0]
      - [0, 0, 0.5]

  # Marginally independent; independent given X.
  - <<: *rdpg_setup
    correlation_zx: &zero_loading
      - [0, 0, 0]
      - [0, 0, 0]
      - [0, 0, 0]
    correlation_yx: *zero_loading
    conditional_correlation_zy: *zero_cross

metrics:
  compute_all: true

output:
  results_dir: results
  file_prefix: rdpg_continuous_conditional_3d
