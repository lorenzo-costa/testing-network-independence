# Bernoulli RDPG with two strata and category-specific Z and Y marginals.
# Each Z coordinate follows the original stratum interval scaled by 1/sqrt(3):
# Z | X=0 ~ Uniform(0, 0.4/sqrt(3)) and
# Z | X=1 ~ Uniform(0.6/sqrt(3), 1/sqrt(3)). Thus Z_i dot Z_j <= 1.
# The eight setups contain four Y pairs and their reversals.
# "gaussian <mean>" denotes a unit-variance normal for each Y coordinate.

simulation:
  nsim: 200
  seed: 1
  n: [100, 200, 500, 1000]
  k: [3]
  ky: [3]
  rho: [0.5]
  alpha: [0.05]
  edge_var: [3]  # Required by the shared design loader; ignored by BernoulliNetwork.
  marginals: [null]  # Class-specific marginals are set in each setup below.

methods:
  npermutations: [500]
  use_true_latent: [false]
  list:
    - name: MultivariateACTest
      kwargs:
        M: 1
        test_type: model_X
        conditional_generator: from_dgp
        use_permutation_coeff: true
      
    - name: MultivariateACTest
      kwargs:
        M: 0.5
        test_type: model_X
        conditional_generator: from_dgp
        use_permutation_coeff: true
      
    - name: MultivariateACTest
      kwargs:
        adaptive_m: true
        test_type: model_X
        conditional_generator: from_dgp
        use_permutation_coeff: true
    
    - name: DistanceCorrelationTest
      kwargs:
        test_method: mgc
        permutation_type: covariate
        test_type: model_X
        conditional_generator: from_dgp

setup_template: &rdpg_setup
  dgp: BernoulliNetwork
  solver: ASE
  rdpg: true
  conditional_copula: gaussian
  C: 2
  class_probabilities: [0.5, 0.5]
  center_latent: false

setups:
  # # Pareto(1.5) versus N(0, 1), then reverse the Y assignments.
  - <<: *rdpg_setup
    marginals_by_class:
      - {z: "uniform 0 0.5773502691896257", y: "pareto 1.5"}
      - {z: "uniform 0.1 0.5773502691896257", y: "gaussian 0"}
  # - <<: *rdpg_setup
  #   marginals_by_class:
  #     - {z: "uniform 0 0.2309401076758503", y: "gaussian 0"}
  #     - {z: "uniform 0.3464101615137754 0.5773502691896257", y: "pareto 1.5"}

  # Cauchy versus N(0, 1), then reverse the Y assignments.
  - <<: *rdpg_setup
    marginals_by_class:
      - {z: "uniform 0 0.5773502691896257", y: cauchy}
      - {z: "uniform 0.1 0.5773502691896257", y: "gaussian 0"}
  # - <<: *rdpg_setup
  #   marginals_by_class:
  #     - {z: "uniform 0 0.2309401076758503", y: "gaussian 0"}
  #     - {z: "uniform 0.3464101615137754 0.5773502691896257", y: cauchy}

  # N(-2, 1) versus N(2, 1), then reverse the Y assignments.
  - <<: *rdpg_setup
    marginals_by_class:
      - {z: "uniform 0 0.5773502691896257", y: "gaussian -2"}
      - {z: "uniform 0.1 0.5773502691896257", y: "gaussian 2"}
  # - <<: *rdpg_setup
  #   marginals_by_class:
  #     - {z: "uniform 0 0.2309401076758503", y: "gaussian 2"}
  #     - {z: "uniform 0.3464101615137754 0.5773502691896257", y: "gaussian -2"}

  # # N(0, 1) versus chi-squared(df=3), then reverse the Y assignments.
  - <<: *rdpg_setup
    marginals_by_class:
      - {z: "uniform 0 0.5773502691896257", y: "gaussian 0"}
      - {z: "uniform 0.1 0.5773502691896257", y: "chi2 3"}
  # - <<: *rdpg_setup
  #   marginals_by_class:
  #     - {z: "uniform 0 0.2309401076758503", y: "chi2 3"}
  #     - {z: "uniform 0.3464101615137754 0.5773502691896257", y: "gaussian 0"}

metrics:
  compute_all: true

output:
  results_dir: results
  file_prefix: conditional_copula_rdpg_stratum_marginals
