# =============================================================================
# Simulation Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Simulation Setup
# -----------------------------------------------------------------------------
simulation:
  nsim: 100
  seed: 1                 

  n: [100, 300]      
  k: [1]                  
  ky: [1]
  snr: [0.1, 0.3, 0.4]  # Var(f(Z)) / (Var(f(Z)) + Var(noise))
  alpha: [0.05]           
  edge_var: [3]           
  predictor_distribution: [gaussian, uniform_rdpg]

  # Functional settings for k=1.
  functionals:
    - name: linear
      kwargs:
        weights: [0.5]
        normalize_index: true
    - name: piecewise
      kwargs:
        weights: [0.5]
        normalize_index: true
        switch_feature: 0
        threshold: 0.5
    - name: sigmoid
      kwargs:
        weights: [0.5]
        normalize_index: true
        threshold: 0.0
        slope: 5.0
        global_scale: 10.0
      kwargs_by_predictor_distribution:
        uniform_rdpg:
          threshold: 0.5
          slope: 17.0
    - name: sine
      kwargs:
        weights: [0.5]
        normalize_index: true
        frequency: 5.0
        global_scale: 10.0
      kwargs_by_predictor_distribution:
        uniform_rdpg:
          frequency: 30.0
    - name: abs_max
      kwargs:
        center: 0.0
        input_scale: 1.0
      kwargs_by_predictor_distribution:
        uniform_rdpg:
          center: 0.5
          input_scale: 6.0
    - name: tanh_product
      kwargs:
        input_scale: 1.0
        global_scale: 10.0
        center: 0.0
      kwargs_by_predictor_distribution:
        uniform_rdpg:
          input_scale: 6.0
          center: 0.5
    - name: pareto
      kwargs:
        weights: [0.5]
        normalize_index: true
        alpha: 1.0
        scale: 2.0
        tail_clip: 1e-12
      kwargs_by_predictor_distribution:
        uniform_rdpg:
          alpha: 0.2
          scale: 0.05

# -----------------------------------------------------------------------------
# Testing Methods
# -----------------------------------------------------------------------------
methods:
  npermutations: [200]      
  use_true_latent: [True]

  # List of test methods to benchmark. 'kwargs' are passed to the method constructor.
  list:
    - name: MultivariateACTest
      kwargs:
        M: 1
        use_permutation_coeff: false

    - name: MultivariateACTest
      kwargs:
        M: 0.5
        use_permutation_coeff: false

    - name: MultivariateACTest
      kwargs:
        adaptive_m: true
        use_permutation_coeff: false
      
    - name: DiffusionCorrelation
      kwargs: {}

    - name: RVtest
      kwargs:
        approximation: asymptotic

    - name: RVtest
      kwargs:
        approximation: permutation
        permutation_type: latent
    
    - name: CanonicalCorrelation
      kwargs: {}

# -----------------------------------------------------------------------------
# DGP & Solver Setups (H1: rho > 0)
# Each entry pairs a data-generating process (network type + copula) with a solver.
# 'dgp' and 'solver' are string identifiers resolved in load_config.py.
# -----------------------------------------------------------------------------
setups:
  - dgp: BernoulliNetwork
    solver: ASE
    rdpg: auto

# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  compute_all: true

output:
  results_dir: results   # Files are named: simulation_results_<YYYYMMDD_HHMM>.csv
