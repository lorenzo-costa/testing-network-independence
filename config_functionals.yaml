# =============================================================================
# Simulation Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Simulation Setup
# -----------------------------------------------------------------------------
simulation:
  nsim: 100         
  seed: 1                 

  n: [100, 300, 500]      
  k: [3]                  
  ky: [1]
  rho: [0.2]              
  alpha: [0.05]           
  edge_var: [3]           
  noise_scale : [2.0]

  functionals:
    - name: pareto
      kwargs:
        alpha: 0.8
    - name: sigmoid
      kwargs:
        global_scale : 10.0
    - name: sine
      kwargs:
        global_scale : 10.0
    - name: interaction
      kwargs: {}
    - name: linear
      kwargs: {}
    - name: radial
      kwargs: {}
    - name: tanh_product
      kwargs:
        global_scale : 10.0
    - name: manifold
      kwargs: {}
    - name: abs_max
      kwargs: {}
    - name: max
      kwargs: {}

# -----------------------------------------------------------------------------
# Testing Methods
# -----------------------------------------------------------------------------
methods:
  npermutations: [200]      
  use_true_latent: [False]

  # List of test methods to benchmark. 'kwargs' are passed to the method constructor.
  list:
    # - name: DiffusionCorrelation
    #   kwargs: {}

    - name: RVtest
      kwargs:
        approximation: asymptotic

    - name: RVtest
      kwargs:
        approximation: permutation
        permutation_type: latent

    # - name: MultivariateACTest
    #   kwargs:
    #     M: 1

    # - name: MultivariateACTest
    #   kwargs:
    #     M: 0.5

    # - name: MultivariateACTest
    #   kwargs:
    #     adaptive_m: true

# -----------------------------------------------------------------------------
# DGP & Solver Setups (H1: rho > 0)
# Each entry pairs a data-generating process (network type + copula) with a solver.
# 'dgp' and 'solver' are string identifiers resolved in load_config.py.
# -----------------------------------------------------------------------------
setups:
  - dgp: BernoulliNetwork
    solver: pgd_fit_wrapper

  - dgp: GaussianNetwork
    solver: ASE

# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  compute_all: true

output:
  results_dir: results   # Files are named: simulation_results_<YYYYMMDD_HHMM>.csv
