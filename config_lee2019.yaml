# =============================================================================
# Config: Lee 2019 Latent Simulation Study
# Replicates the dependency patterns from Lee et al. (2019).
# Networks are generated from diverse latent functional relationships
# (linear, spiral, circle, etc.) rather than copula models.
# =============================================================================


# -----------------------------------------------------------------------------
# Simulation Control
# -----------------------------------------------------------------------------
simulation:
  nsim: 100
  seed: 1

  n: [100, 300, 500]   
  k: [1]                    
  alpha: [0.05]
  edge_var: [3]          

# -----------------------------------------------------------------------------
# Testing Methods
# -----------------------------------------------------------------------------
methods:
  npermutations: [200]      
  df: [3]                   
  use_true_latent: [False]

  # List of test methods to benchmark. 'kwargs' are passed to the method constructor.
  list:
    # - name: DiffusionCorrelation
    #   kwargs: {}

    - name: RVtest
      kwargs:
        approximation: asymptotic

    - name: RVtest
      kwargs:
        approximation: permutation
        permutation_type: latent

    - name: MultivariateACTest
      kwargs:
        M: 1

    - name: MultivariateACTest
      kwargs:
        M: 0.5

    - name: MultivariateACTest
      kwargs:
        adaptive_m: true


# -----------------------------------------------------------------------------
# DGP & Solver Setups
# All setups use ASE with k=2 (two-dimensional embedding regardless of latent k).
# The latent_sim key selects the functional form of the latent relationship.
# noise: true adds observation noise to the latent positions.
# -----------------------------------------------------------------------------
setups:

  # --- Gaussian (continuous-weight) networks ---
  gaussian_latent_sims:
    - linear
    - exponential
    - cubic
    - quadratic
    - w_shaped
    - spiral
    - step
    - fourth_root
    - joint_normal
    - logarithmic
    - sin_sixteen_pi
    - square
    - diamond
    - circle
    - ellipse
    - two_parabolas
    - uncorrelated_bernoulli
    - multimodal_independence   

  # --- Bernoulli (binary-edge) networks ---
  bernoulli_latent_sims:
    - linear
    - exponential
    - cubic
    - quadratic
    - w_shaped
    - spiral
    - step
    - fourth_root
    - joint_normal
    - logarithmic
    - sin_sixteen_pi
    - square
    - diamond
    - circle
    - ellipse
    - two_parabolas
    - uncorrelated_bernoulli
    - multimodal_independence   

  bernoulli_rdpg: hypersphere        


# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  compute_all: true

output:
  results_dir: results   # Files are named: simulation_results_<YYYYMMDD_HHMM>.csv
