# =============================================================================
# Config: Lee 2019 Latent Simulation Study
# Replicates the dependency patterns from Lee et al. (2019).
# Networks are generated from diverse latent functional relationships
# (linear, spiral, circle, etc.) rather than copula models.
# =============================================================================


# -----------------------------------------------------------------------------
# Simulation Control
# -----------------------------------------------------------------------------
simulation:
  nsim: 100                
  seed: 1

  n: [100, 400]   # Includes n=50 to probe small-sample behaviour
  k: [1]                    # Single latent dimension (scalar latent variable)
  alpha: [0.05]
  edge_var: [3]          # Two edge variances: standard and inflated noise

# -----------------------------------------------------------------------------
# Testing Methods
# -----------------------------------------------------------------------------
methods:
  npermutations: [200]      # Number of permutations used in permutation-based tests
  df: [3]                   # Degrees of freedom (used in Student-t approximations)
  use_true_latent_x: [True]  
  use_true_latent_z: [False]  
 
  # List of test methods to benchmark. 'kwargs' are passed to the method constructor.
  list:    
    - name: MultivariateACTest
      kwargs:
        M: 1              
  
# -----------------------------------------------------------------------------
# DGP & Solver Setups
# All setups use ASE with k=2 (two-dimensional embedding regardless of latent k).
# The latent_sim key selects the functional form of the latent relationship.
# noise: true adds observation noise to the latent positions.
# -----------------------------------------------------------------------------
setups:

  # --- Gaussian (continuous-weight) networks ---
  gaussian_latent_sims:
    - linear
    - exponential
    - cubic
    - quadratic
    - w_shaped
    - spiral
    - step
    - fourth_root
    - joint_normal
    - logarithmic
    - sin_sixteen_pi
    - square
    - diamond
    - circle
    - ellipse
    - two_parabolas
    - uncorrelated_bernoulli
    - multimodal_independence   # No noise kwarg for this one (see loader)

  # --- Bernoulli (binary-edge) networks ---
  # All use rdpg='minmax' rescaling so edge probabilities stay in [0,1]
  bernoulli_latent_sims:
    - linear
    - exponential
    - cubic
    - quadratic
    - w_shaped
    - spiral
    - step
    - fourth_root
    - joint_normal
    - logarithmic
    - sin_sixteen_pi
    - square
    - diamond
    - circle
    - ellipse
    - two_parabolas
    - uncorrelated_bernoulli
    - multimodal_independence   # No noise kwarg for this one (see loader)

  bernoulli_rdpg: hypersphere        # RDPG rescaling strategy for Bernoulli networks


# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  compute_all: true   
 
output:
  results_dir: results   # Files are named: simulation_results_<YYYYMMDD_HHMM>.csv
