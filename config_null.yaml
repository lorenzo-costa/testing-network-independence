# =============================================================================
# Null Simulation Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Simulation Setup
# -----------------------------------------------------------------------------
simulation:
  nsim: 100
  seed: 1

  n: [100, 300, 500]
  k: [3]
  ky: [1]
  rho: [0.0]
  alpha: [0.05]
  edge_var: [3]

  marginals_z:
    - gaussian
    - "uniform -1 1"
    - "chi 5"

  marginals_y:
    - gaussian
    - cauchy
    - "chi 5"

  column_covariance:
    - [[1, 0.99, 0], [0.99, 1, 0], [0, 0, 1]]
    - [[3, 0, 0], [0, 1, 0], [0, 0, 0.5]]
    - [[1, 0, 0], [0, 1, 0], [0, 0, 1]]

# -----------------------------------------------------------------------------
# Testing Methods
# -----------------------------------------------------------------------------
methods:
  npermutations: [200]
  df: [3]
  use_true_latent: [False]

  list:
    # - name: DiffusionCorrelation
    #   kwargs: {}

    - name: RVtest
      kwargs:
        approximation: asymptotic

    - name: RVtest
      kwargs:
        approximation: permutation
        permutation_type: latent

    # - name: MultivariateACTest
    #   kwargs:
    #     M: 1

    # - name: MultivariateACTest
    #   kwargs:
    #     M: 0.5

    # - name: MultivariateACTest
    #   kwargs:
    #     adaptive_m: true

# -----------------------------------------------------------------------------
# Gaussian-copula network setups under the null
# -----------------------------------------------------------------------------
setups:
  - dgp: GaussianNetwork
    copula_model: gaussian
    solver: ASE

  - dgp: BernoulliNetwork
    copula_model: gaussian
    solver: pgd_fit_wrapper

# -----------------------------------------------------------------------------
# Metrics and output
# -----------------------------------------------------------------------------
metrics:
  compute_all: true

output:
  results_dir: results
