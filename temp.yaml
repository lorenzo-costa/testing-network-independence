# =============================================================================
# Simulation Configuration
# =============================================================================

# -----------------------------------------------------------------------------
# Simulation Setup
# -----------------------------------------------------------------------------
simulation:
  nsim: 100
  seed: 1                 

  n: [100, 300]      
  k: [4]                  
  ky: [1]
  snr: [0.1, 0.3, 0.5, 0.7]  # Var(f(Z)) / (Var(f(Z)) + Var(noise))
  alpha: [0.05]           
  edge_var: [3]           
  predictor_distribution: [gaussian, uniform_rdpg]

  # Functional settings for k=1.
  functionals:
    - name: sine
      kwargs:
        weights: [0.5, 0.5, 0.5, 0.5]
        normalize_index: true
        frequency: 3.0
        global_scale: 10.0
      kwargs_by_predictor_distribution:
        uniform_rdpg:
          frequency: 15.0

# -----------------------------------------------------------------------------
# Testing Methods
# -----------------------------------------------------------------------------
methods:
  npermutations: [200]      
  use_true_latent: [False]

  # List of test methods to benchmark. 'kwargs' are passed to the method constructor.
  list:
    - name: MultivariateACTest
      kwargs:
        M: 1
        use_permutation_coeff: false

    - name: MultivariateACTest
      kwargs:
        M: 0.5
        use_permutation_coeff: false

    - name: MultivariateACTest
      kwargs:
        adaptive_m: true
        use_permutation_coeff: false
      
    - name: DiffusionCorrelation
      kwargs: {}

    - name: RVtest
      kwargs:
        approximation: asymptotic

    - name: RVtest
      kwargs:
        approximation: permutation
        permutation_type: latent
    
    - name: CanonicalCorrelation
      kwargs: {}

# -----------------------------------------------------------------------------
# DGP & Solver Setups (H1: rho > 0)
# Each entry pairs a data-generating process (network type + copula) with a solver.
# 'dgp' and 'solver' are string identifiers resolved in load_config.py.
# -----------------------------------------------------------------------------
setups:
  - dgp: BernoulliNetwork
    # Match the estimator to the link selected by rdpg: auto.
    solver:
      uniform_rdpg: ASE
      gaussian: pgd_fit_wrapper
    rdpg: auto

# -----------------------------------------------------------------------------
# Metrics
# -----------------------------------------------------------------------------
metrics:
  compute_all: true

output:
  results_dir: results   # Files are named: simulation_results_<YYYYMMDD_HHMM>.csv
